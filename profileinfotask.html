<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        
        #container{
            height: 100vh;
            width: 100%;
            background-color: rgba(207, 206, 205, 0.699);
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .box{
            height: 370px;
            width: 280px;
            background-color: white;
            border-radius: 20px;
            transition-property: all;
            transition-duration: 1s;
            box-shadow: 3px 3px 5px 5px gray ;
        }
        .box:hover{
            transform: translateY(20px);
        }
        #profile{
            height: 140px;
            /* border: 2px solid black; */
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        #content{
            height: 60px;
            /* border: 2px solid black; */
            text-align: center;
            margin: 0%;
            
        }
        #details{
            height:40px ;
            /* border: 2px solid black; */
            text-align: center;
            padding: 4px;
        }
        #course{
            height: 55px;
            /* border: 2px solid black; */
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        #buttons{
            height:45px;
            /* border: 2px solid black; */
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        img{
            height: 140px;
        }
        h4{
            color: blue;
            margin-top: 5px;
        }
        .core{
            /* border: 2px solid black; */
            padding: 6px;
            border-radius: 20px;
            background-color: rgba(246, 244, 244, 0.808);
            color: blue;
        }
        button{
            padding: 7px;
            border-radius: 10px;
            background-color: blue;
            color: white;
            border: none;
            transition-property: all;
            transition-duration: 1s;
        }
        h2{
            margin-top: 0%;
            margin-bottom: 5px;
        }
        button:hover{
            transform: scale(120%,120%);
        }
        
    </style>
</head>
<body>
    <div id="container">
        <div class="box">
            <div id="profile">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzfKVebdr293EDQtNJVITlMaM2kgR-XR7ITcdTi2-U0g&s=10" alt="">
            </div>
            <div id="content">
                <h2>Yaswanth</h2>
                <h4>Python Full Stack Development</h4>
            </div>
            <div id="details">
                📍Bengaluru
                <br>
                📧yashu@example.com
            </div>
            <div id="course">
                <div class="core">HTML</div>
                <div class="core">CSS</div>
                <div class="core">Java</div>
                <div class="core">JavaScript</div>
            </div>
            <div id="buttons">
                <button>view Profile</button>
                <button>Content</button>
            </div>
        </div>
    </div>

</body>
</html>
