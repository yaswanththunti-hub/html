<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instagram</title>
    <style>
        #nav{
            height: 75px;
            background-color: whitesmoke;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px;
        }
        #logo{
            height: 75px;
            width: 150px;  
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            
        }
         #search{
            height: 75px;
            width: 400px;
           
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
         #menu{
            height: 75px;
            width: 300px;
           
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        #logo img{
            height: 75px;
            mix-blend-mode: multiply;
        }
        #search input{
            width: 350px;
            height: 30px;
            border-radius: 60px;
        }
        #menu a{
            font-size: x-large ;
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>
    <div id="nav">
        <div id="logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSv69OqpKWzXBgp5KwsrNhCEQfPKzNZJSxb5ubHpNBuvQ&s=10" alt="">
        </div>
        <div id="search">
            <center>
            <input type="search" placeholder="🔍︎ Search">
            </center>
        </div>
        <div id="menu">
            <a href="">🏠︎</a><a href="">➤</a><a href="">❤︎</a><a href="">👤</a>
        </div>
    </div>
</body>
</html>
