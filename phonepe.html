<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonepe</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bolder;
            background-color: none;
        }
        #navbar{
            height: 75px;
            background-color: whitesmoke;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        #navbar img{
            height: 130px;
        }
        #container{
            border: 2px solid black;
            height: 80vh;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            background-color: #5C249A;
        }
        .boxes{
            
            height: 65vh;
            width: 30.33%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-direction: column;
            background-color: white;
            border-radius: 60px;
            box-shadow: 10px 10px 10px rgba(245, 244, 247, 0.379);
        }
        .boxes div{
            height: 80vh;
            width: 100%;
            padding: 10px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        #box1 img{
            height:300px;
        }
        input{
            width: 50%;
            background-color: seashell;
            border-radius: 50px;
            padding: 7px;
            border: none;
            color:darkmagenta ;
            text-align: center;
        }
        input::placeholder{
            color: darkmagenta;
        }
        button{
            width: 80%;
            border-radius: 60px;
            border: none;
            color: white;
            background-color: darkmagenta;
            padding: 7px;
        }
        button:hover{
            background-color: white;
            color: darkviolet;
        }
    </style>
</head>
<body>
    <div id="navbar">
        <img src="c:\Users\yaswa\Downloads\ChatGPT Image Sep 23, 2026, 02_39_49 PM.png" alt="">
    </div>
    <div id="container">
        <div class="boxes">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQybp78GB5EBuv_noQpCBaqJpsi4I8gGcU6qKeeMsh8WA&s=10" alt="">
            </div>
            <div id="box2">
                <input type="tel" placeholder="Phone number">
                
                <a href="">View plans</a>
                </div>
            <div id="box3">
                <button>Pay Amount</button></div>
        </div>
        <div class="boxes">
