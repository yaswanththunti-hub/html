<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentagonspace</title>
    <style>
        *{
            font-family: 'Times New Roman', Times, serif;
            font-weight: bolder;
        }
        #navbar{
            height: 75px;
            
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #002876;
            border-radius: 20px;
        }
        #menu{
            height: 75px;
            width: 400px;
            
            display: flex;
            justify-content:space-evenly ;
            align-items: center;
        }
        #logo{
            height: 75px;
            width: 200px;
            display: flex;
            justify-content:space-evenly ;
            align-items: center;
        }
        #logo img{
            height: 70px;

        }
        #menu a{
            text-decoration: none;
            color: white;
        }
        #menu button{
            color: black;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <div id="navbar">
        <div id="logo">
            <img src="https://pentagonspace.in/_nuxt/PentagonLogo.CLFPXG1l.png" alt="">
        </div>
        <div id="menu">
            <a href="">Home</a><a href="">About</a><a href="">Courses</a><a href="">Contact</a>
            <button>signin</button>
        </div>
    </div>
</body>
</html>
