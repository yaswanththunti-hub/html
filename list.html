<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <!-- orderedlist -->
    <ol>
        <li>Chicken</li>
        <li>BasmatiRice</li>
        <li>spices</li>
    </ol>
    <!-- unorederedlist -->
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
    </ul>
    <!-- definitionlist -->
    <dl>
        <dt>Pyhton</dt>
        <dd>Core Python</dd>
    </dl>
    <!-- Nestedlist -->
    <ol>
        <li>fullstack</li>
        <ol>
            <li>python</li>
            <li>sql</li>
            <li>web</li>
        </ol>
    </ol>
    <ul>
        <li>fullstack</li>
        <ul>
            <li>java</li>
            <li>sql</li>
            <li>web</li>
        </ul>
    </ul>

</body>
</html>
