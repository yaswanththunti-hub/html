<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>youtube</title>
    <style>
        #nav{
            height: 75px;
            border: 2px solid black ;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px;
        }
        #logo{
            height: 75px;
            width: 150px;
            
            display: flex;
            justify-content:space-evenly;
            align-items: center;
        }
        #search{
            height: 75px;
            width: 350px;
            display: flex;
            justify-content:space-evenly;
            align-items: center;
        }
        #signin{
            height: 75px;
            width: 120px;
            display: flex;
            justify-content:space-evenly;
            align-items: center;
        }
        #logo img{
            height: 60px;
        }
        #signin button{
            background-color: white;
        }
        #search a,#logo a{
            text-decoration: none;
        }
        #search button{
            border-radius: 70px;
            background-color: whitesmoke;
            border: none;
        }
        #search input{
            width: 270px;
        }
    </style>
</head>
<body>
    <div id="nav">
        <div id="logo">
            <a href="">&#9776</a>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCl3qbJemf2mtQyV9jfQ0-9246Rg2xT5CS3rDVDNBfOA&s=10" alt="">
        </div>
        <div id="search">
            <input type="search" placeholder="Search">
            <button>🔍︎</button>
            <button>🎙️</button>
            <!-- <a href="">🔍︎</a>
            <a href="">🎙️</a> -->
        </div>
        <div id="signin">
            ⫶ <button>👤SIGN IN</button>
        </div>
    </div>
</body>
</html>
