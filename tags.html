<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=3, initial-scale=1.0">
    <title>Tags</title>
</head>
<body>
    <!-- 1.pairedtags -->
    <!-- Headingtags -->
    <h1>Hello</h1>
    <h2>Hello</h2>
    <h3>Hello</h3>
    <h4>Hello</h4>
    <h5>Hello</h5>
    <h6>Hello</h6>

    <!-- formatting -->
    <b>Bold</b>
    <strong>Strong</strong>
    <i>italic</i>
    <em>emphasis</em>
    <u>Underline</u>
    <strik>Strik</strik>
    <mark>Mark</mark>
    A<sup>+</sup>
    h<sub>2</sub>0

    <!-- othertags -->
    <p>lorem*10</p>
    <pre>lorem</pre>
    <div>division</div>


    <!-- 2.unpairedtags -->
    <hr> 
    <!-- horizontal line -->
    <br>
    <!-- break -->
    <img> 
    <!-- image -->
</body>
</html>
